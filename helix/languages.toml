use-grammars = { only = [ "haskell"] }

[[language]]
name = "go"
auto-format = true

[[language]]
name = "python"
auto-format = true

[[language]]
name = "haskell"
auto-format = false

[[grammar]]
name = "haskell"
source = { git = "https://github.com/tree-sitter-grammars/tree-sitter-haskell", rev = "98aedbd2d6947a168ba3ba3755d70b0cb6b78395" }

[[language]]
name = "lua"
roots = [".luarc.json"]
auto-format = true

[[language]]
name = "markdown"
text-width = 80

[language.soft-wrap]
enable = true
wrap-at-text-width = true
wrap-indicator = ""
