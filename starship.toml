"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](bg1)\
$os\
$directory\
[](fg:bg1 bg:bg2)\
[](fg:bg2 bg:bg3)\
$git_branch\
$git_status\
$git_commit\
[](fg:bg3 bg:bg4)\
$c\
$custom\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$python\
$rust\
$scala\
[ ](fg:bg4 )\
$line_break$character\
"""

# Disable the blank line at the start of the prompt
add_newline = true

palette = "ken"

[palettes.ken]
bg1 = "#14181B"
fg1 = "#93B7EF"

bg2 = "#1F242A"
fg2 = "#cc98e3"

bg3 = "#295151"
fg3 = "#9ECE6A"

bg4 = "#6495ED"
fg4 = "#FFFFFF"

bg5 = "#9d5fba"
fg5 = "#FFFFFF"

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
# style_user = "bg:#9A348E"
# style_root = "bg:#9A348E"
format = '[$user ]($style)'
disabled = false

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "bg:bg1 fg:fg1"
disabled = false        # Disabled by default

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[directory]
style = "bg:bg1 fg:fg1"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"code" = " "
"src" = "󰯂"

# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[c]
symbol = " "
style = "bg:bg4 fg:fg4"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "bg:bg4 fg:fg4"
format = '[ $symbol ($version) ]($style)'

[custom.godot]
description = "<custom config>"
command = "echo  Godot $(godot-mono --version | cut -d'.' -f1-3)"
detect_extensions = ["godot", "tscn"]
style = "bg:bg4 fg:fg4"
format = "[$output]($style)"

[docker_context]
symbol = " "
style = "bg:#06969A"
format = '[ $symbol $context ]($style)'

[git_branch]
style = "bg:bg3 fg:fg3"
format = "[: $branch]($style)"

[git_status]
style = "bg:bg3 fg:fg3"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:bg4 fg:fg4"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:bg4 fg:fg4"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:bg4 fg:fg4"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:bg4 fg:fg4"
format = '[ $symbol ($version) ]($style)'

[python]
symbol = ""
style = "bg:bg4 fg:fg4"
format = '[ $symbol ${pyenv_prefix} (${version}) ($virtualenv)]($style)'

[rust]
symbol = ""
style = "bg:bg4 fg:fg4"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R"             # Hour:Minute Format
style = "bg:bg5 fg:fg5"
format = '[  $time ]($style)'
